<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darbari Coffee</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.08); /* زوم ملایم برای مخفی کردن واترمارک ویدیو */
            opacity: 0.6;
        }

        .scroll-space {
            height: 400vh; 
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .lang-switcher {
            pointer-events: auto;
            position: absolute;
            top: 30px;
            right: 40px;
            display: flex;
            gap: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            direction: ltr;
        }

        .lang-switcher span {
            color: #888;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .lang-switcher span:hover {
            color: #ccc;
        }

        .lang-switcher span.active {
            color: #e5a93c;
        }

        .text-content {
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .title {
            font-size: 5rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.8rem;
            color: #e5a93c;
            margin-top: 10px;
            font-weight: 300;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            font-size: 1.2rem;
            letter-spacing: 1px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="bg-video" src="video.mp4" muted playsinline preload="auto"></video>
    </div>

    <div class="overlay">
        <div class="lang-switcher">
            <span id="lang-tr" onclick="setLang('tr')">TR</span>
            <span id="lang-en" onclick="setLang('en')">EN</span>
            <span id="lang-fa" class="active" onclick="setLang('fa')">FA</span>
        </div>

        <div class="text-content">
            <p class="title" id="main-title">دانه اصل</p>
            <p class="subtitle" id="main-subtitle">شروعی در تاریکی مطلق</p>
        </div>

        <div class="scroll-indicator" id="scroll-text">السكرول ↓</div>
    </div>

    <div class="scroll-space"></div>

    <script>
        const video = document.getElementById('bg-video');
        
        video.addEventListener('loadedmetadata', () => {
            video.pause();
            video.currentTime = 0;
        });

        let scrollFraction = 0;

        window.addEventListener('scroll', () => {
            const maxScroll = document.body.scrollHeight - window.innerHeight;
            scrollFraction = window.scrollY / maxScroll;
        });

        function updateVideo() {
            if (video.duration) {
                video.currentTime = video.duration * scrollFraction;
            }
            requestAnimationFrame(updateVideo);
        }
        requestAnimationFrame(updateVideo);

        const translations = {
            fa: {
                title: "دانه اصل",
                subtitle: "شروعی در تاریکی مطلق",
                scroll: "السكرول ↓",
                dir: "rtl"
            },
            en: {
                title: "Original Seed",
                subtitle: "A beginning in absolute darkness",
                scroll: "Scroll ↓",
                dir: "ltr"
            },
            tr: {
                title: "Orijinal Çekirdek",
                subtitle: "Mutlak karanlıkta bir başlangıç",
                scroll: "Kaydır ↓",
                dir: "ltr"
            }
        };

        function setLang(lang) {
            document.documentElement.dir = translations[lang].dir;
            document.documentElement.lang = lang;

            document.getElementById('main-title').innerText = translations[lang].title;
            document.getElementById('main-subtitle').innerText = translations[lang].subtitle;
            document.getElementById('scroll-text').innerText = translations[lang].scroll;

            document.querySelectorAll('.lang-switcher span').forEach(el => el.classList.remove('active'));
            document.getElementById('lang-' + lang).classList.add('active');
        }
    </script>
</body>
</html>
